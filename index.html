
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prashant AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 850px;
    height: 95vh;
    background: #151c30;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #303b55;
}

header {
    padding: 18px;
    background: #1d2942;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #303b55;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    background: #1677ff;
    padding: 12px;
    border-radius: 12px;
    font-size: 22px;
}

.logo h2 {
    font-size: 21px;
}

.logo p {
    color: #a5b4d0;
    font-size: 12px;
    margin-top: 4px;
}

button {
    cursor: pointer;
    border: none;
}

.new-chat {
    background: #1677ff;
    color: white;
    padding: 11px 15px;
    border-radius: 8px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
}

.message {
    display: flex;
    margin-bottom: 20px;
    gap: 10px;
    align-items: flex-start;
}

.avatar {
    min-width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #1677ff;
    display: flex;
    justify-content: center;
    align-items: center;
}

.user-avatar {
    background: #263650;
}

.message-content {
    background: #202c45;
    padding: 14px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.user .message-content {
    background: #0756c9;
}

.user {
    flex-direction: row-reverse;
}

.welcome {
    text-align: center;
    margin-top: 70px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.welcome p {
    color: #a5b4d0;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
}

.suggestions button {
    background: #202c45;
    color: white;
    padding: 12px;
    border-radius: 10px;
}

.input-area {
    padding: 18px;
    background: #1d2942;
    border-top: 1px solid #303b55;
}

.input-box {
    display: flex;
    gap: 10px;
    background: #0b1020;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #34445d;
}

input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    min-width: 0;
}

.send {
    background: #1677ff;
    color: white;
    padding: 12px 18px;
    border-radius: 9px;
}

.send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.note {
    text-align: center;
    color: #8291ad;
    font-size: 11px;
    margin-top: 10px;
}

@media(max-width: 600px) {
    .app {
        height: 100vh;
        border-radius: 0;
    }

    .welcome h1 {
        font-size: 25px;
    }

    #chat {
        padding: 14px;
    }

    .message-content {
        max-width: 88%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        <div class="logo-icon">🤖</div>
        <div>
            <h2>Prashant AI</h2>
            <p>Gemini AI Assistant</p>
        </div>
    </div>

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>
</header>

<div id="chat">

    <div class="welcome" id="welcome">
        <h1>👋 Hello! Welcome</h1>
        <p>I'm your AI assistant. Ask me anything!</p>

        <div class="suggestions">
            <button onclick="suggest('Explain Artificial Intelligence')">
                🤖 Explain AI
            </button>

            <button onclick="suggest('Write a story')">
                📖 Write a Story
            </button>

            <button onclick="suggest('Give me JavaScript code')">
                💻 Coding Help
            </button>

            <button onclick="suggest('Tell me a science fact')">
                🔬 Science Fact
            </button>
        </div>
    </div>

</div>

<div class="input-area">
    <div class="input-box">
        <input
            type="text"
            id="userInput"
            placeholder="Ask anything..."
            autocomplete="off"
        >

        <button class="send" id="sendBtn" onclick="sendMessage()">
            Send ➤
        </button>
    </div>

    <p class="note">
        AI can make mistakes. Check important information.
    </p>
</div>

</div>

<script>

// Add your secure backend URL here.
// Do not put your private Gemini API key in this HTML file.
const API_URL = "/api/chat";

let history = [];

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender) {

    document.getElementById("welcome")?.remove();

    const message = document.createElement("div");
    message.className = "message " + sender;

    const avatar = document.createElement("div");
    avatar.className = "avatar " +
        (sender === "user" ? "user-avatar" : "");

    avatar.textContent = sender === "user" ? "👤" : "🤖";

    const content = document.createElement("div");
    content.className = "message-content";

    // Safe text rendering
    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;

    return content;
}

async function sendMessage() {

    const text = input.value.trim();

    if (!text || sendBtn.disabled) return;

    addMessage(text, "user");

    history.push({
        role: "user",
        content: text
    });

    input.value = "";
    sendBtn.disabled = true;

    const loading = addMessage("Thinking...", "bot");

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                history: history
            })
        });

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        if (!data.reply) {
            throw new Error("No AI reply received.");
        }

        loading.textContent = data.reply;

        history.push({
            role: "assistant",
            content: data.reply
        });

    } catch (error) {

        loading.textContent =
            "Connection failed. Please check your backend server.";

        console.error(error);

    } finally {

        sendBtn.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;

    }
}

function suggest(text) {
    input.value = text;
    sendMessage();
}

function newChat() {

    history = [];

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>👋 Hello! Welcome</h1>
            <p>I'm your AI assistant. Ask me anything!</p>
        </div>
    `;

    input.value = "";
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script>

</body>
</html>
